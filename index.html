<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
  <meta content="utf-8" http-equiv="encoding">
  <title>Where Can I Watch This?</title>
  <link rel="stylesheet" type="text/css" href="css/style.css">
  <link rel="stylesheet" type="text/css" href="css/input.css">
  <link rel="stylesheet" type="text/css" href="css/modal.css">
  <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css'>
  <script defer src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script defer src="js/script.js"></script>
  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=UA-164558254-1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'UA-164558254-1');
  </script>

</head>

<div class="country-selector-container">
  <select id="country-selector">
    <option value="IN">🇮🇳 India (Default)</option>
    <option value="US">🇺🇸 United States</option>
    <option value="GB">🇬🇧 United Kingdom</option>
    <option value="CA">🇨🇦 Canada</option>
  </select>
</div>

<p class="headline">Where can I watch this?</p>
<ul id="growing-search-container">
  <li>
    <div class="growing-search">
      <div class="input">
        <input id="input" type="text" name="search" placeholder="TV Show / Movie" list="dataList">
      </div>
    </div>
  </li>
</ul>

<ul id="dataList" class="flex" style="list-style-type:none;"></ul>
<!-- The Modal -->
<div id="myModal" class="modal">
  <!-- Modal content -->
  <div class="modal-content">
    <p><span class="close">&times;</span></p>
    <div class="modal-header">
      <h2 class="modal-title">Modal Header</h2>
    </div>

    <div id="image-rating">
      <div id="movie-rating">
        <div class="imdb"></div>
        <div class="rt"></div>
      </div>
    </div>

    <div class="modal-body">
      <p class="description">Some text in the Modal Body</p>
      <div class="season-browser" id="season-browser" style="display: none;"></div>
      <p class="country-availability" id="country-availability" style="display: none;"></p>
    </div>

    <div class="switch-container">
      <div class="switch-toggle switch-3 switch-candy"></div>
    </div>

    <div class="modal-providers">
      <ul id="provider-list"></ul>
    </div>

    <div class="video-gallery">
      <h3 class="video-title">Trailers</h3>
      <ul id="video" class="video-flex">
        <!-- <iframe style="width: 33%;" src="https://www.youtube.com/embed/tgbNymZ7vqY">
          </iframe> 
          <iframe style="width: 33%" src="https://www.youtube.com/embed/tgbNymZ7vqY">
          </iframe> 
          <iframe style="width: 33%" src="https://www.youtube.com/embed/tgbNymZ7vqY"></iframe>  -->
      </ul>
    </div>

    <div class="suggestions-gallery" id="suggestions-gallery" style="display: none;">
      <h3 class="suggestions-title">More Like This</h3>
      <ul id="modal-suggestions" class="flex" style="list-style-type:none;"></ul>
    </div>

    <div class="modal-footer">
      <h3>Modal Footer</h3>
    </div>

  </div>
</div>

<div class="footer">
  <a class="link" href="http://supr.design">Brought to you by - Supr•Design</a>
</div>
</body>

</html>
